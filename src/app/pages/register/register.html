<div class="flex flex-col items-center justify-center min-h-screen bg-gray-100">
  <div *ngIf="isCheckingAuth" class="text-lg text-gray-600">Checking authentication...</div>
  <form *ngIf="!isCheckingAuth" (submit)="onSubmit($event)" class="bg-white p-8 rounded shadow-md w-full max-w-sm">
    <h2 class="text-2xl font-bold mb-4">Register</h2>
    <div class="mb-4">
      <label class="block mb-1">Name</label>
      <input name="name" type="text" class="w-full border rounded px-3 py-2" required />
    </div>
    <div class="mb-4">
      <label class="block mb-1">Username</label>
      <input name="username" type="text"
        class="w-full border border-black rounded px-3 py-2 focus:outline-none"
        [ngClass]="{
          'border-green-500 ring-2 ring-green-300': usernameAvailable === true && usernameFocused,
          'border-red-500 ring-2 ring-red-300': usernameAvailable === false && usernameFocused
        }"
        required
        (input)="onUsernameInput($event)"
        (focus)="usernameFocused = true"
        (blur)="usernameFocused = false"
        autocomplete="off"
        [value]="username"
      />
      <div *ngIf="usernameAvailable === false && usernameFocused" class="text-red-500 text-xs mt-1">Username is not available</div>
    </div>
    <div class="mb-4">
      <label class="block mb-1">Password</label>
      <input name="password" type="password" class="w-full border rounded px-3 py-2" required />
    </div>
    <div class="mb-4">
      <label class="block mb-1">Contact Number</label>
      <input name="contactNumber" type="text" class="w-full border rounded px-3 py-2" required />
    </div>
    <div class="mb-4">
      <label class="block mb-1">Short Bio</label>
      <textarea name="shortBio" class="w-full border rounded px-3 py-2" required></textarea>
    </div>
    <div *ngIf="error" class="text-red-500 mb-2">{{error}}</div>
    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 cursor-pointer">Register</button>
    <div class="mt-4 text-center">
      <a routerLink="/login" class="text-blue-600 hover:underline">Already have an account? Login</a>
    </div>
  </form>
</div>
