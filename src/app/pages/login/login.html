<div class="flex flex-col items-center justify-center min-h-screen bg-gray-100">
  <div *ngIf="isCheckingAuth" class="text-lg text-gray-600">Checking authentication...</div>
  <form *ngIf="!isCheckingAuth" (submit)="onSubmit($event)" class="bg-white p-8 rounded shadow-md w-full max-w-sm">
    <h2 class="text-2xl font-bold mb-4">Login</h2>
    <div class="mb-4">
      <label class="block mb-1">Username</label>
      <input name="username" type="text" class="w-full border rounded px-3 py-2" required (input)="onInput()" />
    </div>
    <div class="mb-4">
      <label class="block mb-1">Password</label>
      <input name="password" type="password" class="w-full border rounded px-3 py-2" required (input)="onInput()" />
    </div>
    <div *ngIf="error" class="text-red-500 mb-2">{{error}}</div>
    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 cursor-pointer">Login</button>
    <div class="mt-4 text-center">
      <a routerLink="/register" class="text-blue-600 hover:underline">Don't have an account? Register</a>
    </div>
  </form>
</div>
